name: PSMDT Stage 1 Validation

on:
  push:
    branches: [main]
    paths:
      - 'config.lua'
      - 'sql/**'
      - 'server/**'
      - 'client/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/psmdt-validation.yml'
  pull_request:
    paths:
      - 'config.lua'
      - 'sql/**'
      - 'server/**'
      - 'client/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/psmdt-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Validate only the newest pushed revision to avoid accumulating redundant
# Actions jobs while Stage 1 source fixes are being committed.
concurrency:
  group: psmdt-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          find server client -type f -name '*.lua' -print0 | xargs -0 -r luac5.4 -p
          luac5.4 -p config.lua
      - name: Stage 1 access regression
        run: lua5.4 tests/phase1/access_regression.lua
      - name: EMS dashboard server regression
        run: lua5.4 tests/ems_dashboard/server_regression.lua
      - name: Evidence record-scope regression
        run: lua5.4 tests/phase1/evidence_scope_regression.lua
      - name: FTO employer isolation regression
        run: lua5.4 tests/phase2/fto_employer_regression.lua
      - name: State accreditation issuer regression
        run: lua5.4 tests/phase3/accreditation_issuer_regression.lua
      - name: Evidence disclosure runtime regression
        run: lua5.4 tests/phase4/evidence_disclosure_runtime.lua
      - name: Report disclosure runtime regression
        run: lua5.4 tests/phase4/report_disclosure_runtime.lua
      - name: Case disclosure runtime regression
        run: lua5.4 tests/phase4/case_disclosure_runtime.lua
      - name: Case disclosure runtime regression
        run: lua5.4 tests/phase4/disclosed_case_runtime.lua
      - name: IA referral runtime regression
        run: lua5.4 tests/phase4/ia_referral_runtime.lua
      - name: Stage 5 public records transaction regression
        run: lua5.4 tests/phase5/public_records_runtime.lua
      - name: Stage 5 civilian records isolation regression
        run: lua5.4 tests/phase5/public_records_civilian_runtime.lua
      - name: Stage 5 public services vector regression
        run: lua5.4 tests/phase5/public_service_locations_runtime.lua
      - name: Stage 5 target-to-MDT opening regression
        run: lua5.4 tests/phase5/records_office_open_runtime.lua
      - name: Stage 5 controlled public-release copies regression
        run: lua5.4 tests/phase5/public_release_copies_runtime.lua
      - name: Stage 6 government jurisdiction isolation regression
        run: lua5.4 tests/phase6/government_jurisdiction_policy.lua
      - name: Stage 6 government notices privacy and publication regression
        run: lua5.4 tests/phase6/government_notices_runtime.lua
      - name: Stage 6 legislation and official-vote runtime regression
        run: lua5.4 tests/phase6/government_legislation_runtime.lua
      - name: Stage 6 annual government budgets authority regression
        run: lua5.4 tests/phase6/government_budgets_runtime.lua
      - name: Stage 6 SADOT tow permit eligibility regression
        run: lua5.4 tests/phase6/sadot_tow_eligibility.lua
      - name: Stage 6 business licensing authority and rollback regression
        run: lua5.4 tests/phase6/government_business_licenses_runtime.lua
      - name: Stage 6 assessor jurisdiction and audit regression
        run: lua5.4 tests/phase6/government_property_assessments_runtime.lua
      - name: Government SOP regression
        run: lua5.4 tests/phase1/government_sop_regression.lua
      - name: Government roster regression
        run: lua5.4 tests/phase2/government_roster_regression.lua
      - name: Government employment regression
        run: lua5.4 tests/phase3/government_employment_regression.lua

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type and Svelte validation
        run: npm run check
      - name: Build NUI
        run: npm run build
      - name: Attach compiled NUI for development-server testing
        uses: actions/upload-artifact@v4
        with:
          name: psmdt-nui-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Frontend regressions
        working-directory: .
        run: |
          node tests/phase1/unique_callback_regression.cjs
          node tests/phase3/accreditation_schema_regression.cjs
          node tests/phase4/ia_ownership_regression.cjs
          node tests/phase4/ia_referral_regression.cjs
          node tests/phase4/disclosure_regression.cjs
          node tests/phase4/case_disclosure_regression.cjs
          node tests/phase4/report_disclosure_regression.cjs
          node tests/phase4/evidence_disclosure_regression.cjs
          node tests/phase5/public_records_regression.cjs
          node tests/phase6/government_notices_regression.cjs
          node tests/phase6/government_legislation_contract.cjs
          node tests/phase6/government_business_licenses_contract.cjs
          node tests/phase6/government_property_assessments_contract.cjs
          node tests/basics/navigation_regression.cjs
          node tests/basics/dashboard_routes_regression.cjs
          node tests/ems_dashboard/frontend_regression.cjs
          node tests/phase1/auth_frontend_regression.cjs web/node_modules/svelte/compiler web/node_modules/typescript
          node tests/phase1/check-frontend.cjs web/node_modules/svelte/compiler web/node_modules/typescript
          node tests/phase2/government_frontend_regression.cjs
          node tests/phase3/government_frontend_regression.cjs

  stage4-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_test_only
          MARIADB_DATABASE: psmdt_test
          MARIADB_USER: psmdt
          MARIADB_PASSWORD: dev_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Exercise Stage 4 migrations and access predicates
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_USER: psmdt
          MARIADB_DATABASE: psmdt_test
          MYSQL_PWD: dev_test_only
        run: |
          bash tests/phase4/mysql_disclosures.sh
          bash tests/phase5/mysql_public_records.sh
          bash tests/phase6/mysql_government_notices.sh
          bash tests/phase6/mysql_government_business_licenses.sh
          bash tests/phase6/mysql_government_property_assessments.sh
          bash tests/phase6/mysql_sadot_eligibility.sh
          bash tests/phase6/mysql_government_assessments.sh
